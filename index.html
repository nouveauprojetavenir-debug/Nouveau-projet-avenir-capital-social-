<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avenir Capital</title>
    <style>
        :root {
            --bg: #0a1a12;
            --card: #132e21;
            --tx: #f8fafc;
            --mu: #a3b8af;
            --pr: #10b981;
        }
        body {
            background-color: var(--bg);
            color: var(--tx);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: var(--card);
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { margin-top: 0; color: var(--pr); }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: var(--mu); font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #2d4a3e;
            background: #0a1a12;
            color: var(--tx);
            border-radius: 8px;
            box-sizing: border-box;
        }
        .btn {
            background-color: var(--pr);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Avenir Capital</h2>
        
        <!-- Formulaire avec autocomplétion désactivée -->
        <div class="input-group">
            <label for="ph">Numéro de téléphone</label>
            <input type="tel" id="ph" autocomplete="off" placeholder="+225...">
        </div>

        <div class="input-group">
            <label for="pw">Mot de passe</label>
            <input type="password" id="pw" autocomplete="new-password" placeholder="••••••">
        </div>

        <button class="btn" onclick="login()">Se connecter</button>
    </div>

<script>
    function login() {
        const phone = document.getElementById('ph').value;
        const pw = document.getElementById('pw').value;
        if(!phone || !pw) {
            alert("Veuillez remplir tous les champs");
            return;
        }
        // Votre logique de connexion existante...
    }
</script>

</body>
</html>
